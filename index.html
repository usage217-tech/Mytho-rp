<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HERMAX</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: #080810;
            --surface: #0e0e1a;
            --surface2: #13131f;
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --accent: #b87fff;
            --accent2: #ff7eb3;
            --accent-glow: rgba(184,127,255,0.2);
            --text: #ede8f5;
            --muted: rgba(237,232,245,0.4);
            --gold: #e8c97a;
        }

        html, body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 85px;
        }

        ::-webkit-scrollbar { width: 0; }

        /* ── NOISE OVERLAY ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        /* ── HEADER ── */
        .header {
            padding: 24px 20px 8px;
            position: relative;
            z-index: 1;
        }

        .header-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.08em;
            background: linear-gradient(135deg, #ede8f5 0%, #b87fff 50%, #ff7eb3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .header-sub {
            font-size: 10px;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-top: 3px;
        }

        /* ── TABS ── */
        .tab-content { display: none; animation: fadeIn 0.25s ease; }
        .tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── SECTION LABEL ── */
        .section-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            padding: 0 20px;
            margin: 22px 0 12px;
        }

        /* ── STYLE SWITCHER (top pill) ── */
        .style-switcher {
            display: flex;
            margin: 0 20px 4px;
            background: var(--surface);
            border-radius: 14px;
            padding: 4px;
            border: 1px solid var(--border);
        }

        .style-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .style-btn.active {
            background: var(--surface2);
            color: var(--text);
            font-weight: 600;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }

        /* ── GENDER SELECTOR ── */
        .gender-hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 20px;
        }

        .gender-hero-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .gender-hero-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.25s;
        }

        .gender-hero-btn:nth-child(1)::before {
            background: radial-gradient(ellipse at 50% 100%, rgba(184,127,255,0.15) 0%, transparent 70%);
        }

        .gender-hero-btn:nth-child(2)::before {
            background: radial-gradient(ellipse at 50% 100%, rgba(255,126,179,0.15) 0%, transparent 70%);
        }

        .gender-hero-btn.active::before { opacity: 1; }

        .gender-hero-btn.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent), inset 0 0 30px rgba(184,127,255,0.05);
        }

        .gender-hero-btn:nth-child(2).active {
            border-color: var(--accent2);
            box-shadow: 0 0 0 1px var(--accent2), inset 0 0 30px rgba(255,126,179,0.05);
        }

        .gender-icon {
            font-size: 28px;
            line-height: 1;
        }

        .gender-label {
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
        }

        .gender-sub {
            font-size: 11px;
            color: var(--muted);
        }

        /* ── CHARACTER GRID ── */
        .char-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 16px;
        }

        .char-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--surface);
            transition: transform 0.2s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            aspect-ratio: 0.72;
            --glow: rgba(184,127,255,0.25);
        }

        .char-card:active { transform: scale(0.96); }

        .char-card.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent), 0 0 40px var(--glow);
        }

        .char-card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .char-card:active .char-card-img { transform: scale(1.03); }

        .char-card-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 50px 14px 16px;
            background: linear-gradient(to top, rgba(5,5,12,0.95) 0%, rgba(5,5,12,0.5) 50%, transparent 100%);
        }

        .char-card-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 21px;
            font-weight: 700;
            color: #fff;
            line-height: 1.1;
            margin-bottom: 3px;
        }

        .char-card-desc {
            font-size: 11px;
            color: rgba(255,255,255,0.55);
            line-height: 1.4;
        }

        .char-check {
            position: absolute;
            top: 10px; right: 10px;
            width: 26px; height: 26px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.25);
            background: transparent;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
            font-size: 12px;
        }

        .char-card.selected .char-check {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* ── CUSTOM CARD ── */
        .custom-card-inner {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 10px; padding: 20px;
            background: linear-gradient(145deg, #110a2a, #0a0818);
            border: 1px dashed rgba(184,127,255,0.25);
            border-radius: 20px;
        }

        .custom-pill {
            background: rgba(184,127,255,0.12);
            border: 1px solid rgba(184,127,255,0.2);
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .custom-card-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
        }

        .custom-card-sub {
            font-size: 11px;
            color: var(--muted);
            text-align: center;
            line-height: 1.5;
        }

        /* ── CUSTOM FIELDS ── */
        .custom-fields {
            padding: 0 16px;
            margin-top: 14px;
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .custom-fields.visible { display: flex; }

        /* ── SCENE PICKER (preloaded) ── */
        .scene-picker {
            padding: 0 16px;
            margin-top: 14px;
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .scene-picker.visible { display: flex; }

        .scene-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .scene-card:active { transform: scale(0.98); }

        .scene-card.selected {
            border-color: var(--accent);
            background: rgba(184,127,255,0.06);
        }

        .scene-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--muted);
            margin-top: 5px;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .scene-card.selected .scene-dot { background: var(--accent); }

        .scene-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            font-style: italic;
            color: rgba(237,232,245,0.7);
            line-height: 1.5;
        }

        .scene-card.selected .scene-text { color: var(--text); }

        /* ── INPUTS ── */
        .field-wrap { display: flex; flex-direction: column; gap: 6px; }

        .field-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.18em;
        }

        .field-input, .field-textarea {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            padding: 14px 16px;
            outline: none;
            transition: border-color 0.2s;
            resize: none;
        }

        .field-input::placeholder, .field-textarea::placeholder { color: var(--muted); }
        .field-input:focus, .field-textarea:focus { border-color: rgba(184,127,255,0.5); }

        /* ── USER GENDER BUTTONS ── */
        .user-gender-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .user-gender-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 13px 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .user-gender-btn.active {
            background: rgba(184,127,255,0.12);
            border-color: var(--accent);
            color: var(--text);
            font-weight: 600;
        }

        /* ── SCENARIO TEXTAREA ── */
        .scenario-box {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            color: var(--text);
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            padding: 18px;
            outline: none;
            min-height: 130px;
            resize: none;
            transition: border-color 0.2s;
            line-height: 1.65;
        }

        .scenario-box::placeholder { color: var(--muted); font-style: italic; }
        .scenario-box:focus { border-color: rgba(184,127,255,0.5); }

        /* ── MANIFEST BUTTON ── */
        .manifest-btn {
            width: calc(100% - 32px);
            margin: 20px 16px 12px;
            padding: 18px;
            background: linear-gradient(135deg, #7c3aed, #b87fff, #ff7eb3);
            border: none;
            border-radius: 18px;
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 8px 32px rgba(184,127,255,0.3), 0 0 0 1px rgba(255,255,255,0.05) inset;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s;
            position: relative;
            overflow: hidden;
        }

        .manifest-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
        }

        .manifest-btn:active::before { left: 100%; }
        .manifest-btn:active { transform: scale(0.97); box-shadow: 0 4px 16px rgba(184,127,255,0.2); }

        .next-btn {
            width: 100%;
            padding: 16px;
            background: var(--surface2);
            border: 1px solid var(--border-hover);
            border-radius: 16px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s ease;
        }

        .next-btn:active { transform: scale(0.98); }

        /* ── BOTTOM NAV ── */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 72px;
            background: rgba(8,8,16,0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-around;
            padding: 0 12px;
            z-index: 100;
        }

        .nav-btn {
            display: flex; flex-direction: column;
            align-items: center; gap: 4px;
            cursor: pointer;
            padding: 8px 24px;
            border-radius: 14px;
            border: none;
            background: transparent;
            transition: all 0.2s ease;
        }

        .nav-icon {
            width: 22px; height: 22px;
            stroke: var(--muted);
            fill: none;
            stroke-width: 1.8;
            transition: stroke 0.2s;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0.05em;
            transition: color 0.2s;
        }

        .nav-btn.active .nav-icon { stroke: var(--accent); }
        .nav-btn.active .nav-label { color: var(--accent); }

        /* ── DIVIDER ── */
        .divider {
            height: 1px;
            background: var(--border);
            margin: 20px 16px;
        }

        /* ── IDENTITY / SCENARIO SECTIONS ── */
        .page-section {
            padding: 0 16px;
            display: flex; flex-direction: column; gap: 18px;
            margin-top: 8px;
        }

        /* ── FADE UP ANIM ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .fade-up {
            animation: fadeUp 0.3s ease both;
        }

        .fade-up:nth-child(1) { animation-delay: 0.00s; }
        .fade-up:nth-child(2) { animation-delay: 0.05s; }
        .fade-up:nth-child(3) { animation-delay: 0.10s; }
        .fade-up:nth-child(4) { animation-delay: 0.15s; }
        .fade-up:nth-child(5) { animation-delay: 0.20s; }
        .fade-up:nth-child(6) { animation-delay: 0.25s; }

        /* ── STYLE TABS (inline) ── */
        .style-tabs-inline {
            display: flex;
            gap: 8px;
            padding: 0 20px;
            margin-bottom: 14px;
        }

        .style-tab-pill {
            padding: 7px 18px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .style-tab-pill.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(184,127,255,0.3);
        }
    </style>
</head>
<body>

<!-- ===================== PERSONA TAB ===================== -->
<div id="tab-chars" class="tab-content active">
    <div class="header">
        <div class="header-logo">HERMAX</div>
        <div class="header-sub">Royal Noir · Roleplay</div>
    </div>

    <p class="section-label">Choose a companion</p>
    <div class="gender-hero">
        <button class="gender-hero-btn" id="btn-female" onclick="setAiGender('Female')">
            <div class="gender-icon">♀</div>
            <div class="gender-label">The Queen</div>
            <div class="gender-sub">Female characters</div>
        </button>
        <button class="gender-hero-btn" id="btn-male" onclick="setAiGender('Male')">
            <div class="gender-icon">♂</div>
            <div class="gender-label">The King</div>
            <div class="gender-sub">Male characters</div>
        </button>
    </div>

    <div id="style-section" style="display:none;">
        <p class="section-label">Style</p>
        <div class="style-tabs-inline">
            <button class="style-tab-pill active" id="btn-realistic" onclick="setStyle('Realistic')">Realistic</button>
            <button class="style-tab-pill" id="btn-anime" onclick="setStyle('Anime')">Anime</button>
        </div>
    </div>

    <div id="char-section" style="display:none;">
        <p class="section-label" id="char-section-label">Select a persona</p>
        <div class="char-grid" id="char-grid"></div>

        <!-- Custom fields (custom char only) -->
        <div class="custom-fields" id="custom-fields">
