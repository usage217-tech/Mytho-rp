<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HERMAX ROLEPLAY</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: #0a0a0f;
            --card-bg: #111118;
            --card-border: rgba(255,255,255,0.07);
            --accent: #c084fc;
            --accent-glow: rgba(192,132,252,0.3);
            --text: #f0e6ff;
            --text-muted: rgba(240,230,255,0.45);
            --pink: #f472b6;
            --gold: #fbbf24;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 0; }

        /* ===== HEADER ===== */
        .header {
            padding: 20px 20px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0e6ff, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-sub {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* ===== TABS ===== */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ===== SECTION TITLE ===== */
        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 0 20px;
            margin: 20px 0 12px;
        }

        /* ===== CHARACTER GRID ===== */
        .char-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 16px;
        }

        /* ===== CHARACTER CARD ===== */
        .char-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            border: 1.5px solid var(--card-border);
            background: var(--card-bg);
            transition: transform 0.2s ease, border-color 0.2s ease;
            aspect-ratio: 0.72;
        }

        .char-card:active { transform: scale(0.97); }

        .char-card.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent), 0 0 30px var(--accent-glow);
        }

        .char-card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .char-card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 14px 14px;
            background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
        }

        .char-card-name {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .char-card-desc {
            font-size: 11px;
            font-weight: 400;
            color: rgba(255,255,255,0.65);
            line-height: 1.4;
        }

        /* Custom card (no image) */
        .char-card-custom {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(145deg, #1a0a2e, #0f0820);
            border: 1.5px dashed rgba(192,132,252,0.3);
        }

        .char-card-custom .gem-badge {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .char-card-custom .custom-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            text-align: center;
        }

        .char-card-custom .custom-sub {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            text-align: center;
            padding: 0 10px;
        }

        /* Stars / Selection indicator */
        .char-card .select-ring {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            background: transparent;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .char-card.selected .select-ring {
            background: var(--accent);
            border-color: var(--accent);
        }

        .char-card.selected .select-ring::after {
            content: '✓';
            font-size: 13px;
            color: white;
            font-weight: 700;
        }

        /* ===== CUSTOM FIELDS ===== */
        .custom-fields {
            padding: 0 16px;
            margin-top: 16px;
            display: none;
            gap: 12px;
            flex-direction: column;
        }
        .custom-fields.visible { display: flex; }

        .field-input {
            width: 100%;
            background: #111118;
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            padding: 14px 16px;
            outline: none;
            transition: border-color 0.2s;
            resize: none;
        }
        .field-input::placeholder { color: rgba(255,255,255,0.25); }
        .field-input:focus { border-color: var(--accent); }

        /* ===== IDENTITY TAB ===== */
        .identity-section {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 10px;
        }

        .field-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 8px;
        }

        /* Gender buttons */
        .gender-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .gender-btn {
            background: #111118;
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: var(--text-muted);
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 12px 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .gender-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            font-weight: 600;
        }

        /* ===== SCENARIO TAB ===== */
        .scenario-section {
            padding: 0 16px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .scene-suggestion {
            background: #111118;
            border: 1.5px solid rgba(255,255,255,0.07);
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            font-style: italic;
            cursor: pointer;
            text-align: left;
            width: 100%;
            font-family: 'Playfair Display', serif;
            transition: all 0.2s ease;
            line-height: 1.5;
        }

        .scene-suggestion:active { transform: scale(0.98); }
        .scene-suggestion.selected {
            border-color: var(--accent);
            background: rgba(192,132,252,0.08);
            color: rgba(255,255,255,0.85);
        }

        .scenario-textarea {
            width: 100%;
            background: #111118;
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            color: #fff;
            font-family: 'Playfair Display', serif;
            font-size: 15px;
            padding: 16px;
            outline: none;
            min-height: 120px;
            resize: none;
            transition: border-color 0.2s;
            line-height: 1.6;
        }

        .scenario-textarea::placeholder { color: rgba(255,255,255,0.2); }
        .scenario-textarea:focus { border-color: var(--accent); }

        /* ===== MANIFEST BUTTON ===== */
        .manifest-btn {
            width: calc(100% - 32px);
            margin: 20px 16px;
            padding: 18px;
            background: linear-gradient(135deg, #9333ea, #c084fc, #f472b6);
            border: none;
            border-radius: 18px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(192,132,252,0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .manifest-btn:active {
            transform: scale(0.98);
            box-shadow: 0 4px 16px rgba(192,132,252,0.25);
        }

        .manifest-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 75px;
            background: rgba(10,10,15,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 20px;
            z-index: 100;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px 20px;
            border-radius: 14px;
            border: none;
            background: transparent;
            transition: all 0.2s ease;
        }

        .nav-btn svg {
            width: 24px;
            height: 24px;
            stroke: rgba(255,255,255,0.3);
            fill: none;
            stroke-width: 1.8;
            transition: stroke 0.2s;
        }

        .nav-btn span {
            font-size: 10px;
            font-weight: 500;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.05em;
            transition: color 0.2s;
        }

        .nav-btn.active svg { stroke: var(--accent); }
        .nav-btn.active span { color: var(--accent); }

        /* ===== AI GENDER SELECTOR ===== */
        .ai-gender-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 16px;
            margin-bottom: 8px;
        }

        .ai-gender-btn {
            background: #111118;
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 18px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .ai-gender-btn svg {
            width: 28px;
            height: 28px;
            stroke: rgba(255,255,255,0.4);
            fill: none;
            stroke-width: 1.5;
            transition: stroke 0.2s;
        }

        .ai-gender-btn span {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-weight: 700;
            color: rgba(255,255,255,0.5);
            font-style: italic;
            transition: color 0.2s;
        }

        .ai-gender-btn.active {
            border-color: var(--accent);
            background: rgba(192,132,252,0.1);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .ai-gender-btn.active svg { stroke: var(--accent); }
        .ai-gender-btn.active span { color: white; }

        /* ===== FADE IN ===== */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-up { animation: fadeUp 0.3s ease forwards; }

        /* ===== DIVIDER ===== */
        .divider {
            height: 1px;
            background: rgba(255,255,255,0.05);
            margin: 16px;
        }

        /* ===== STYLE TABS (Anime/Realistic) ===== */
        .style-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 0 16px;
            margin: 12px 0;
        }

        .style-tab-btn {
            background: #111118;
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .style-tab-btn.active {
            background: rgba(192,132,252,0.15);
            border-color: var(--accent);
            color: white;
            font-weight: 600;
        }

        /* ===== IMAGE COLOR GLOW EFFECT ===== */
        .char-card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Dynamic glow applied via JS based on dominant image color */
        .char-card.has-glow {
            box-shadow: 0 0 20px var(--glow-color);
        }

        .char-card.has-glow.selected {
            box-shadow: 0 0 0 1px var(--accent), 0 0 30px var(--glow-color);
        }
    </style>
</head>

        // ============================================================

        // ============================================================
        // STYLE SELECTION (Anime/Realistic)
        // ============================================================
        function setStyle(style) {
            selection.currentStyle = style;
            document.getElementById('btn-realistic').classList.remove('active');
            document.getElementById('btn-anime').classList.remove('active');
            document.getElementById('btn-' + style.toLowerCase()).classList.add('active');
            
            renderCharGrid(currentGender, style);
        }

        // ============================================================
        // EXTRACT DOMINANT COLOR FROM IMAGE
        // ============================================================
        function extractDominantColor(imgElement, callback) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = imgElement.naturalWidth || imgElement.width;
            canvas.height = imgElement.naturalHeight || imgElement.height;
            
            ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);
            
            try {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                let r = 0, g = 0, b = 0, count = 0;
                
                // Sample center area for better color
                const startX = Math.floor(canvas.width * 0.3);
                const endX = Math.floor(canvas.width * 0.7);
                const startY = Math.floor(canvas.height * 0.3);
                const endY = Math.floor(canvas.height * 0.7);
                
                for (let y = startY; y < endY; y += 5) {
                    for (let x = startX; x < endX; x += 5) {
                        const i = (y * canvas.width + x) * 4;
                        r += data[i];
                        g += data[i + 1];
                        b += data[i + 2];
                        count++;
                    }
                }
                
                r = Math.floor(r / count);
                g = Math.floor(g / count);
                b = Math.floor(b / count);
                
                callback(`rgba(${r}, ${g}, ${b}, 0.4)`);
            } catch (e) {
                // CORS or other error, use default purple
                callback('rgba(192, 132, 252, 0.3)');
            }
        }

        // ============================================================
        // TAB SWITCHING
        // ============================================================
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function setAiGender(gender) {
            currentGender = gender;
            document.getElementById('btn-female').classList.remove('active');
            document.getElementById('btn-male').classList.remove('active');
            document.getElementById('btn-' + gender.toLowerCase()).classList.add('active');

            // Show style selection tabs
            document.getElementById('style-section').style.display = 'block';
            
            // Render with current style
            renderCharGrid(gender, selection.currentStyle);
            document.getElementById('char-section').style.display = 'block';
        }

        // ============================================================
        // RENDER CHARACTER GRID
        // ============================================================
        function renderCharGrid(gender, style = 'Realistic') {
            const grid = document.getElementById('char-grid');
            grid.innerHTML = '';

            CHARACTERS[style][gender].forEach(c => {
                const card = document.createElement('div');
                card.className = 'char-card fade-up';
                card.dataset.charId = c.name;

                if (c.isCustom) {
                    card.innerHTML = `
                        <div class="char-card-custom" style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;">
                            <div class="gem-badge">CUSTOM</div>
                            <div class="custom-title">Your character</div>
                            <div class="custom-sub">Will become any character you want.</div>
                        </div>
                        <div class="select-ring"></div>
                    `;
                } else {
                    card.innerHTML = `
                        <img src="${c.image}" class="char-card-img" loading="lazy" crossorigin="anonymous" />
                        <div class="char-card-overlay">
                            <div class="char-card-name">${c.name}</div>
                            <div class="char-card-desc">${c.desc}</div>
                        </div>
                        <div class="select-ring"></div>
                    `;
                    
                    // Extract dominant color from image for glow effect
                    if (c.image) {
                        const img = card.querySelector('.char-card-img');
                        img.onload = () => {
                            extractDominantColor(img, (color) => {
                                card.style.setProperty('--glow-color', color);
                                card.classList.add('has-glow');
                            });
                        };
                        // If image already loaded
                        if (img.complete) {
                            extractDominantColor(img, (color) => {
                                card.style.setProperty('--glow-color', color);
                                card.classList.add('has-glow');
                            });
                        }
                    }
                }

                card.onclick = () => selectChar(c, card);
                grid.appendChild(card);
            });
        }

        // ============================================================
        // SELECT CHARACTER
        // ============================================================
        function selectChar(c, cardEl) {
            // Clear all selections
            document.querySelectorAll('.char-card').forEach(x => x.classList.remove('selected'));
            cardEl.classList.add('selected');

            const customFields = document.getElementById('custom-fields');

            if (c.isCustom) {
                customFields.classList.add('visible');
                selection.charName = '';
                selection.charDesc = '';
                selection.imageUrl = '';
                currentScenes = [];
            } else {
                customFields.classList.remove('visible');
                selection.charName = c.name;
                selection.charDesc = c.desc;
                selection.imageUrl = c.image;
                currentScenes = c.scenes || [];

                // Auto advance to identity tab
                setTimeout(() => switchTab('identity'), 280);
            }
        }

        // ============================================================
        // USER GENDER
        // ============================================================
        function setUserGender(g) {
            selection.userGender = g;
            document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
            const map = { Male: 'm', Female: 'f', Other: 'o' };
            document.getElementById('user-' + map[g]).classList.add('active');
        }

        // ============================================================
        // POPULATE SCENE SUGGESTIONS (when scenario tab opens)
        // ============================================================
        const origSwitchTab = switchTab;
        function switchTab(tabId) {
            if (tabId === 'scenario' && currentScenes.length > 0) {
                const container = document.getElementById('scene-suggestions');
                container.innerHTML = '';
                currentScenes.forEach(s => {
                    const btn = document.createElement('button');
                    btn.className = 'scene-suggestion';
                    btn.textContent = s;
                    btn.onclick = () => {
                        document.getElementById('scenario-input').value = s;
                        document.querySelectorAll('.scene-suggestion').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                    };
                    container.appendChild(btn);
                });
            }
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
            window.scrollTo(0, 0);
        }

        // ============================================================
        // MANIFEST - SEND DATA TO BOT
        // ============================================================
        function manifest() {
            const customName = document.getElementById('custom-name').value.trim();
            const customDesc = document.getElementById('custom-desc').value.trim();
            const userName = document.getElementById('user-name').value.trim();
            const scenario = document.getElementById('scenario-input').value.trim();

            const finalData = {
                ai_name: selection.charName || customName,
                ai_desc: selection.charDesc || customDesc,
                ai_image: selection.imageUrl,
                user_name: userName,
                user_gender: selection.userGender,
                scenario: scenario
            };

            if (!finalData.ai_name) {
                tg.showAlert("Choose or create a character first.");
                return;
            }
            if (!finalData.user_name) {
                tg.showAlert("Enter your name.");
                switchTab('identity');
                return;
            }
            if (!finalData.scenario) {
                tg.showAlert("Write a scenario to begin the story.");
                return;
            }

            tg.sendData(JSON.stringify(finalData));
        }

        // INIT
        // ============================================================

            setUserGender('Male');
