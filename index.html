<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HERMAX ROLEPLAY</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: #0a0a0f;
            --card-bg: #111118;
            --card-border: rgba(255,255,255,0.07);
            --accent: #c084fc;
            --accent-glow: rgba(192,132,252,0.3);
            --text: #f0e6ff;
            --text-muted: rgba(240,230,255,0.45);
            --pink: #f472b6;
            --gold: #fbbf24;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 0; }

        /* ===== HEADER ===== */
        .header {
            padding: 20px 20px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0e6ff, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-sub {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* ===== TABS ===== */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ===== SECTION TITLE ===== */
        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 0 20px;
            margin: 20px 0 12px;
        }

        /* ===== CHARACTER GRID ===== */
        .char-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 16px;
        }

        /* ===== CHARACTER CARD ===== */
        .char-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            border: 1.5px solid var(--card-border);
            background: var(--card-bg);
            transition: transform 0.2s ease, border-color 0.2s ease;
            aspect-ratio: 0.72;
        }

        .char-card:active { transform: scale(0.97); }

        .char-card.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent), 0 0 30px var(--accent-glow);
        }

        .char-card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .char-card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 14px 14px;
            background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
        }

        .char-card-name {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .char-card-desc {
            font-size: 11px;
            font-weight: 400;
            color: rgba(255,255,255,0.65);
            line-height: 1.4;
        }

        /* Custom card (no image) */
        .char-card-custom {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(145deg, #1a0a2e, #0f0820);
            border: 1.5px dashed rgba(192,132,252,0.3);
        }

        .char-card-custom .gem-badge {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .char-card-custom .custom-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            text-align: center;
        }

        .char-card-custom .custom-sub {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            text-align: center;
            padding: 0 10px;
        }

        /* Stars / Selection indicator */
        .char-card .select-ring {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            background: transparent;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .char-card.selected .select-ring {
            background: var(--accent);
            border-color: var(--accent);
        }

        .char-card.selected .select-ring::after {
            content: '✓';
            font-size: 13px;
            color: white;
            font-weight: 700;
        }

        /* ===== CUSTOM FIELDS ===== */
        .custom-fields {
            padding: 0 16px;
            margin-top: 16px;
            display: none;
            gap: 12px;
            flex-direction: column;
        }
        .custom-fields.visible { display: flex; }

        .field-input {
            width: 100%;
            background: #111118;
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            padding: 14px 16px;
            outline: none;
            transition: border-color 0.2s;
            resize: none;
        }
        .field-input::placeholder { color: rgba(255,255,255,0.25); }
        .field-input:focus { border-color: var(--accent); }

        /* ===== IDENTITY TAB ===== */
        .identity-section {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 10px;
        }

        .field-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 8px;
        }

        /* Gender buttons */
        .gender-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .gender-btn {
            background: #111118;
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: var(--text-muted);
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 12px 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .gender-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            font-weight: 600;
        }

        /* ===== SCENARIO TAB ===== */
        .scenario-section {
            padding: 0 16px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .scene-suggestion {
            background: #111118;
            border: 1.5px solid rgba(255,255,255,0.07);
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            font-style: italic;
            cursor: pointer;
            text-align: left;
            width: 100%;
            font-family: 'Playfair Display', serif;
            transition: all 0.2s ease;
            line-height: 1.5;
        }

        .scene-suggestion:active { transform: scale(0.98); }
        .scene-suggestion.selected {
            border-color: var(--accent);
            background: rgba(192,132,252,0.08);
            color: rgba(255,255,255,0.85);
        }

        .scenario-textarea {
            width: 100%;
            background: #111118;
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            color: #fff;
            font-family: 'Playfair Display', serif;
            font-size: 15px;
            padding: 16px;
            outline: none;
            min-height: 120px;
            resize: none;
            transition: border-color 0.2s;
            line-height: 1.6;
        }

        .scenario-textarea::placeholder { color: rgba(255,255,255,0.2); }
        .scenario-textarea:focus { border-color: var(--accent); }

        /* ===== MANIFEST BUTTON ===== */
        .manifest-btn {
            width: calc(100% - 32px);
            margin: 20px 16px;
            padding: 18px;
            background: linear-gradient(135deg, #9333ea, #c084fc, #f472b6);
            border: none;
            border-radius: 18px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(192,132,252,0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .manifest-btn:active {
            transform: scale(0.98);
            box-shadow: 0 4px 16px rgba(192,132,252,0.25);
        }

        .manifest-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 75px;
            background: rgba(10,10,15,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 20px;
            z-index: 100;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px 20px;
            border-radius: 14px;
            border: none;
            background: transparent;
            transition: all 0.2s ease;
        }

        .nav-btn svg {
            width: 24px;
            height: 24px;
            stroke: rgba(255,255,255,0.3);
            fill: none;
            stroke-width: 1.8;
            transition: stroke 0.2s;
        }

        .nav-btn span {
            font-size: 10px;
            font-weight: 500;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.05em;
            transition: color 0.2s;
        }

        .nav-btn.active svg { stroke: var(--accent); }
        .nav-btn.active span { color: var(--accent); }

        /* ===== AI GENDER SELECTOR ===== */
        .ai-gender-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 16px;
            margin-bottom: 8px;
        }

        .ai-gender-btn {
            background: #111118;
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 18px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .ai-gender-btn svg {
            width: 28px;
            height: 28px;
            stroke: rgba(255,255,255,0.4);
            fill: none;
            stroke-width: 1.5;
            transition: stroke 0.2s;
        }

        .ai-gender-btn span {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-weight: 700;
            color: rgba(255,255,255,0.5);
            font-style: italic;
            transition: color 0.2s;
        }

        .ai-gender-btn.active {
            border-color: var(--accent);
            background: rgba(192,132,252,0.1);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .ai-gender-btn.active svg { stroke: var(--accent); }
        .ai-gender-btn.active span { color: white; }

        /* ===== FADE IN ===== */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-up { animation: fadeUp 0.3s ease forwards; }

        /* ===== DIVIDER ===== */
        .divider {
            height: 1px;
            background: rgba(255,255,255,0.05);
            margin: 16px;
        }
    </style>
</head>
<body>

    <!-- ===================== CHARACTERS TAB ===================== -->
    <div id="tab-chars" class="tab-content active">
        <div class="header">
            <div>
                <div class="header-title">HERMAX</div>
                <div class="header-sub">Royal Noir Roleplay</div>
            </div>
        </div>

        <!-- AI Gender Selection -->
        <p class="section-title">Choose a companion</p>
        <div class="ai-gender-grid">
            <button class="ai-gender-btn" id="btn-female" onclick="setAiGender('Female')">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M12 14v6M9 18h6"/></svg>
                <span>The Queen</span>
            </button>
            <button class="ai-gender-btn" id="btn-male" onclick="setAiGender('Male')">
                <svg viewBox="0 0 24 24"><circle cx="10" cy="14" r="4"/><path d="M14 10l5-5M19 5h-4M19 5v4"/></svg>
                <span>The King</span>
            </button>
        </div>

        <!-- Character Grid -->
        <div id="char-section" style="display:none;">
            <p class="section-title" id="char-section-label">Select a persona</p>
            <div class="char-grid" id="char-grid"></div>

            <!-- Custom Character Fields -->
            <div class="custom-fields" id="custom-fields">
                <input type="text" id="custom-name" placeholder="Name the entity..." class="field-input" />
                <textarea id="custom-desc" placeholder="Describe appearance & personality..." class="field-input" rows="3"></textarea>
            </div>
        </div>
    </div>

    <!-- ===================== IDENTITY TAB ===================== -->
    <div id="tab-identity" class="tab-content">
        <div class="header">
            <div>
                <div class="header-title">Your Identity</div>
                <div class="header-sub">Define your presence</div>
            </div>
        </div>

        <div class="identity-section">
            <div>
                <div class="field-label">Your Name</div>
                <input type="text" id="user-name" placeholder="Enter your name..." class="field-input" />
            </div>

            <div>
                <div class="field-label">Your Gender</div>
                <div class="gender-grid">
                    <button class="gender-btn active" id="user-m" onclick="setUserGender('Male')">Male</button>
                    <button class="gender-btn" id="user-f" onclick="setUserGender('Female')">Female</button>
                    <button class="gender-btn" id="user-o" onclick="setUserGender('Other')">Other</button>
                </div>
            </div>

            <button class="manifest-btn" onclick="switchTab('scenario')" style="margin: 0; width: 100%;">
                Next: The Setting
                <svg viewBox="0 0 24 24" style="fill:none;stroke:white;stroke-width:2.5;width:18px;height:18px;"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </div>
    </div>

    <!-- ===================== SCENARIO TAB ===================== -->
    <div id="tab-scenario" class="tab-content">
        <div class="header">
            <div>
                <div class="header-title">The Setting</div>
                <div class="header-sub">Where the story begins</div>
            </div>
        </div>

        <div class="scenario-section">
            <div id="scene-suggestions"></div>
            <textarea
                id="scenario-input"
                class="scenario-textarea"
                placeholder="How does the story begin?..."
            ></textarea>
        </div>

        <button class="manifest-btn" onclick="manifest()">
            Manifest Reality
            <svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
        </button>
    </div>

    <!-- ===================== BOTTOM NAV ===================== -->
    <nav class="bottom-nav">
        <button class="nav-btn active" id="nav-chars" onclick="switchTab('chars')">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span>Persona</span>
        </button>
        <button class="nav-btn" id="nav-identity" onclick="switchTab('identity')">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
            <span>Identity</span>
        </button>
        <button class="nav-btn" id="nav-scenario" onclick="switchTab('scenario')">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
            <span>Setting</span>
        </button>
    </nav>

    <script>
        // ============================================================
        // TELEGRAM INIT
        // ============================================================
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ============================================================
        // CHARACTER DATA (from web app)
        // ============================================================
        const CHARACTERS = {
            Female: [
                {
                    id: 'custom',
                    name: "Your character",
                    desc: "Will become any character you want.",
                    isCustom: true,
                    image: ""
                },
                {
                    name: "Lilith",
                    desc: "Ancient seductive succubus.",
                    image: "https://i.postimg.cc/nLPJ8WTn/image-14.jpg",
                    scenes: [
                        "You secretly descended into the forgotten catacombs... a crimson silhouette waited...",
                        "You broke into the sealed crypt at moonrise... curvy dark form stepped out..."
                    ]
                },
                {
                    name: "Hellien",
                    desc: "300-year-old vampire queen.",
                    image: "https://i.postimg.cc/Pr40sc5p/image-10.jpg",
                    scenes: [
                        "You climbed the crumbling tower stairs... elegant lithe body draped in crimson silk...",
                        "You slipped through the secret passage... regal figure rose from darkness..."
                    ]
                },
                {
                    name: "Maya",
                    desc: "Ruthless billionaire CEO.",
                    image: "https://i.postimg.cc/rs9ZT0cN/image-20.jpg",
                    scenes: [
                        "You used the override code... sharp silhouette turned from the windows...",
                        "You infiltrated the private penthouse elevator... commanding figure stood at the bar..."
                    ]
                },
                {
                    name: "Nika",
                    desc: "Spoiled rich stepsis.",
                    image: "https://i.postimg.cc/W4J93fT3/image-8.jpg",
                    scenes: [
                        "The mansion was silent past 2 AM... bedroom door eased open...",
                        "You heard the shower stop... bratty silhouette appeared in the corridor..."
                    ]
                },
                {
                    name: "Mrs. Grace",
                    desc: "Caring and charming MILF.",
                    image: "https://i.postimg.cc/dtqSBBmz/image-15.jpg",
                    scenes: [
                        "You came downstairs for a midnight snack... voluptuous silhouette leaned against the island...",
                        "Master bedroom door cracked open... seductive figure sat on the edge of the bed..."
                    ]
                }
            ],
            Male: [
                {
                    id: 'custom',
                    name: "Your character",
                    desc: "Will become any character you want.",
                    isCustom: true,
                    image: ""
                },
                {
                    name: "Robert",
                    desc: "Brooding tech billionaire.",
                    image: "https://i.postimg.cc/NFN8b1Qt/image-5.jpg",
                    scenes: [
                        "You were driven to his secluded coastal compound... tall broad silhouette waited...",
                        "You entered the underground bunker... brooding figure stood at the control panel..."
                    ]
                },
                {
                    name: "Mike",
                    desc: "Wealthy strict stepdad.",
                    image: "https://i.postimg.cc/pXTJr1Bj/image-7.jpg",
                    scenes: [
                        "Mansion was quiet... tall broad silhouette appeared in the doorway...",
                        "Woke to the sound of a key... wealthy stepdad stepped into your room..."
                    ]
                },
                {
                    name: "John",
                    desc: "Dominant stepbro.",
                    image: "https://i.postimg.cc/JhbbSwRb/image-6.jpg",
                    scenes: [
                        "House lights off... parents gone... tall muscular shadow filled the frame...",
                        "Door eased open... dominant stepbro silhouette entered... cocky grin in moonlight."
                    ]
                }
            ]
        };

        // ============================================================
        // STATE
        // ============================================================
        let selection = {
            charName: "",
            charDesc: "",
            userName: "",
            userGender: "Male",
            scenario: "",
            imageUrl: ""
        };

        let currentScenes = [];

        // ============================================================
        // TAB SWITCHING
        // ============================================================
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
            window.scrollTo(0, 0);
        }

        // ============================================================
        // AI GENDER SELECTION
        // ============================================================
        function setAiGender(gender) {
            document.getElementById('btn-female').classList.remove('active');
            document.getElementById('btn-male').classList.remove('active');
            document.getElementById('btn-' + gender.toLowerCase()).classList.add('active');

            renderCharGrid(gender);
            document.getElementById('char-section').style.display = 'block';
        }

        // ============================================================
        // RENDER CHARACTER GRID
        // ============================================================
        function renderCharGrid(gender) {
            const grid = document.getElementById('char-grid');
            grid.innerHTML = '';

            CHARACTERS[gender].forEach(c => {
                const card = document.createElement('div');
                card.className = 'char-card fade-up';
                card.dataset.charId = c.name;

                if (c.isCustom) {
                    card.innerHTML = `
                        <div class="char-card-custom" style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;">
                            <div class="gem-badge">CUSTOM</div>
                            <div class="custom-title">Your character</div>
                            <div class="custom-sub">Will become any character you want.</div>
                        </div>
                        <div class="select-ring"></div>
                    `;
                } else {
                    card.innerHTML = `
                        <img src="${c.image}" class="char-card-img" loading="lazy" />
                        <div class="char-card-overlay">
                            <div class="char-card-name">${c.name}</div>
                            <div class="char-card-desc">${c.desc}</div>
                        </div>
                        <div class="select-ring"></div>
                    `;
                }

                card.onclick = () => selectChar(c, card);
                grid.appendChild(card);
            });
        }

        // ============================================================
        // SELECT CHARACTER
        // ============================================================
        function selectChar(c, cardEl) {
            // Clear all selections
            document.querySelectorAll('.char-card').forEach(x => x.classList.remove('selected'));
            cardEl.classList.add('selected');

            const customFields = document.getElementById('custom-fields');

            if (c.isCustom) {
                customFields.classList.add('visible');
                selection.charName = '';
                selection.charDesc = '';
                selection.imageUrl = '';
                currentScenes = [];
            } else {
                customFields.classList.remove('visible');
                selection.charName = c.name;
                selection.charDesc = c.desc;
                selection.imageUrl = c.image;
                currentScenes = c.scenes || [];

                // Auto advance to identity tab
                setTimeout(() => switchTab('identity'), 280);
            }
        }

        // ============================================================
        // USER GENDER
        // ============================================================
        function setUserGender(g) {
            selection.userGender = g;
            document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
            const map = { Male: 'm', Female: 'f', Other: 'o' };
            document.getElementById('user-' + map[g]).classList.add('active');
        }

        // ============================================================
        // POPULATE SCENE SUGGESTIONS (when scenario tab opens)
        // ============================================================
        const origSwitchTab = switchTab;
        function switchTab(tabId) {
            if (tabId === 'scenario' && currentScenes.length > 0) {
                const container = document.getElementById('scene-suggestions');
                container.innerHTML = '';
                currentScenes.forEach(s => {
                    const btn = document.createElement('button');
                    btn.className = 'scene-suggestion';
                    btn.textContent = s;
                    btn.onclick = () => {
                        document.getElementById('scenario-input').value = s;
                        document.querySelectorAll('.scene-suggestion').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                    };
                    container.appendChild(btn);
                });
            }
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
            window.scrollTo(0, 0);
        }

        // ============================================================
        // MANIFEST - SEND DATA TO BOT
        // ============================================================
        function manifest() {
            const customName = document.getElementById('custom-name').value.trim();
            const customDesc = document.getElementById('custom-desc').value.trim();
            const userName = document.getElementById('user-name').value.trim();
            const scenario = document.getElementById('scenario-input').value.trim();

            const finalData = {
                ai_name: selection.charName || customName,
                ai_desc: selection.charDesc || customDesc,
                ai_image: selection.imageUrl,
                user_name: userName,
                user_gender: selection.userGender,
                scenario: scenario
            };

            if (!finalData.ai_name) {
                tg.showAlert("Choose or create a character first.");
                return;
            }
            if (!finalData.user_name) {
                tg.showAlert("Enter your name.");
                switchTab('identity');
                return;
            }
            if (!finalData.scenario) {
                tg.showAlert("Write a scenario to begin the story.");
                return;
            }

            tg.sendData(JSON.stringify(finalData));
        }

        // ============================================================
        // INIT
        // ============================================================
        window.onload = () => {
            setUserGender('Male');
        };
    </script>
</body>
</html>
